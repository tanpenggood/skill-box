[package]
name = "skillbox"
version = "0.1.0"
description = "SkillBox · 跨 Agent 统一管理 AI Skills 的桌面应用"
authors = ["SkillBox"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "skillbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
walkdir = "2"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
ureq = "2.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
